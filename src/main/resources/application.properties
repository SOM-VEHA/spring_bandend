server.address=0.0.0.0
server.port=8080
spring.application.name=spring_bandend
#database
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=postgres
spring.datasource.password=admin
#jpa
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
#jwt
jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes-please}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
#redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2s
## AES-256 key for encrypting captcha codes in Redis
## Generate a new one: openssl rand -base64 32
# AES-256 key
encryption.secret-key=${ENCRYPTION_SECRET_KEY:GoYeAriehFXooFM12206sP02E646czNwD8wi3mB4RL8=}
# CAPTCHA
captcha.enabled=${CAPTCHA_ENABLED:true}
captcha.length=${CAPTCHA_LENGTH:4}
captcha.ttl-minutes=${CAPTCHA_TTL_MINUTES:3}
captcha.master-code=${CAPTCHA_MASTER_CODE:}